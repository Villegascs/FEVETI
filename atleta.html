<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FEVETI - Perfil de Atleta</title>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" type="image/png" href="Logos/logo_Federación venezolana de tiro-01.png">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/@sanity/client@6.15.2/dist/index.browser.js"></script>
    <style>
        .profile-container {
            max-width: 800px;
            margin: 120px auto 60px;
            padding: 40px;
            background: rgba(255, 255, 255, 0.95);
            border-radius: 30px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255,255,255,0.3);
            text-align: center;
            opacity: 0;
            transform: translateY(30px);
            transition: all 0.8s cubic-bezier(0.2, 0.8, 0.2, 1);
        }

        .profile-container.loaded {
            opacity: 1;
            transform: translateY(0);
        }

        .profile-header {
            position: relative;
            margin-bottom: 30px;
        }

        .profile-photo {
            width: 200px;
            height: 200px;
            border-radius: 50%;
            object-fit: cover;
            margin: 0 auto 20px;
            border: 8px solid white;
            box-shadow: 0 10px 25px rgba(0,0,0,0.15);
            background: #eee;
        }

        .profile-name {
            font-size: 2.5rem;
            color: var(--primary-blue);
            margin-bottom: 5px;
            font-weight: 800;
            text-transform: uppercase;
        }

        .profile-id {
            display: inline-block;
            background: var(--primary-blue);
            color: white;
            padding: 5px 20px;
            border-radius: 50px;
            font-weight: 600;
            font-size: 1.1rem;
            margin-bottom: 20px;
        }

        .profile-details {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-top: 40px;
            text-align: left;
        }

        .detail-item {
            padding: 20px;
            background: #f8f9fa;
            border-radius: 15px;
            border-left: 5px solid var(--primary-red);
        }

        .detail-label {
            display: block;
            font-size: 0.8rem;
            color: #777;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 5px;
        }

        .detail-value {
            font-size: 1.2rem;
            font-weight: 700;
            color: #333;
        }

        .status-badge {
            display: inline-block;
            margin-top: 10px;
            padding: 5px 15px;
            border-radius: 50px;
            font-size: 0.9rem;
            font-weight: 600;
            text-transform: uppercase;
        }

        .status-activo { background: #d4edda; color: #155724; }
        .status-inactivo { background: #f8d7da; color: #721c24; }
        .status-suspendido { background: #fff3cd; color: #856404; }

        .loading-state {
            padding: 100px;
            font-size: 1.5rem;
            color: #666;
        }

        .error-state {
            padding: 100px;
            text-align: center;
        }

        .error-state i {
            font-size: 4rem;
            color: var(--primary-red);
            margin-bottom: 20px;
        }

        @media (max-width: 600px) {
            .profile-container {
                margin: 100px 15px 40px;
                padding: 25px;
            }
            .profile-name { font-size: 1.8rem; }
        }
    </style>
</head>
<body>

    <header>
        <a href="index.html" class="logo-container" style="text-decoration: none; color: inherit;">
            <img src="Logos/logo_Federación venezolana de tiro-01.png" alt="Logo FEVETI" decoding="async">
            <h1>Federación Venezolana <br> de Tiro</h1>
        </a>
        <nav>
            <ul>
                <li><a href="index.html">Inicio</a></li>
                <li><a href="about.html">Sobre Nosotros</a></li>
                <li><a href="calendar.html">Calendario</a></li>
                <li><a href="results.html">Resultados</a></li>
                <li><a href="records.html">Records</a></li>
                <li><a href="regulations.html">Reglamentos</a></li>
                <li><a href="contact.html">Contacto</a></li>
            </ul>
        </nav>
        <div class="mobile-menu-btn"><i class="fas fa-bars"></i></div>
    </header>

    <main id="profile-content">
        <div class="loading-state">
            <i class="fas fa-circle-notch fa-spin"></i> Cargando datos del atleta...
        </div>
    </main>

    <footer>
        <div class="footer-grid">
            <div class="footer-col" style="text-align: center;">
                <h3>Redes Sociales</h3>
                <div class="footer-social" style="justify-content: center;">
                    <a href="https://www.instagram.com/federacionvenezolanadetiro/" class="instagram" target="_blank" rel="noopener noreferrer"><i class="fab fa-instagram"></i></a>
                    <a href="https://www.facebook.com/FederacionVenezolanaDeTiroFeveti" class="facebook" target="_blank" rel="noopener noreferrer"><i class="fab fa-facebook-f"></i></a>
                    <a href="https://www.youtube.com/@federacionvenezolanadetiro866" class="youtube" target="_blank" rel="noopener noreferrer"><i class="fab fa-youtube"></i></a>
                </div>
            </div>
            <div class="footer-col" style="text-align: right;">
                <h3>FEVETI</h3>
                <p style="color: #ccc; font-size: 0.9rem;">Elevando el tiro deportivo venezolano.</p>
            </div>
        </div>
        <div class="footer-bottom">
            <p>&copy; 2026 FEVETI. Todos los derechos reservados.</p>
        </div>
    </footer>

    <script>
        const client = sanityClient.createClient({
            projectId: '98r6cxw2',
            dataset: 'production',
            useCdn: true,
            apiVersion: '2024-05-06',
        });

        async function fetchAthlete() {
            const urlParams = new URLSearchParams(window.location.search);
            const athleteId = urlParams.get('id');
            const athleteSlug = urlParams.get('slug');

            if (!athleteId && !athleteSlug) {
                renderError('No se especificó un atleta.');
                return;
            }

            let query = '';
            let params = {};

            if (athleteSlug) {
                query = `*[_type == "atleta" && slug.current == $slug][0]{
                    ...,
                    "fotoUrl": foto.asset->url
                }`;
                params = { slug: athleteSlug };
            } else {
                query = `*[_type == "atleta" && idFederativo == $id][0]{
                    ...,
                    "fotoUrl": foto.asset->url
                }`;
                params = { id: athleteId };
            }

            try {
                const atleta = await client.fetch(query, params);
                if (atleta) {
                    renderProfile(atleta);
                } else {
                    renderError('Atleta no encontrado en nuestra base de datos.');
                }
            } catch (error) {
                console.error('Error fetching athlete:', error);
                renderError('Error al conectar con el servidor.');
            }
        }

        function renderProfile(atleta) {
            const container = document.getElementById('profile-content');
            const photoUrl = atleta.fotoUrl || 'Logos/logo_Federación venezolana de tiro-01.png';
            
            container.innerHTML = `
                <div class="profile-container" id="profile-card">
                    <div class="profile-header">
                        <img src="${photoUrl}" alt="${atleta.nombre}" class="profile-photo" loading="lazy" decoding="async">
                        <h2 class="profile-name">${atleta.nombre} ${atleta.apellido}</h2>
                        <div class="profile-id">${atleta.idFederativo}</div>
                        <div>
                            <span class="status-badge status-${atleta.status || 'activo'}">
                                ${atleta.status || 'Activo'}
                            </span>
                        </div>
                    </div>

                    <div class="profile-details">
                        <div class="detail-item">
                            <span class="detail-label">Categoría</span>
                            <span class="detail-value">${atleta.categoria || 'N/A'}</span>
                        </div>
                        <div class="detail-item">
                            <span class="detail-label">Disciplina</span>
                            <span class="detail-value">${atleta.disciplina?.replace('_', ' ') || 'N/A'}</span>
                        </div>
                        <div class="detail-item">
                            <span class="detail-label">Club / Asociación</span>
                            <span class="detail-value">${atleta.club || atleta.estado || 'Independiente'}</span>
                        </div>
                        <div class="detail-item">
                            <span class="detail-label">Vigencia</span>
                            <span class="detail-value">2025-2026</span>
                        </div>
                    </div>
                </div>
            `;

            setTimeout(() => {
                document.getElementById('profile-card').classList.add('loaded');
            }, 100);
        }

        function renderError(message) {
            const container = document.getElementById('profile-content');
            container.innerHTML = `
                <div class="error-state">
                    <i class="fas fa-exclamation-triangle"></i>
                    <h2>¡Ups!</h2>
                    <p>${message}</p>
                    <br>
                    <a href="index.html" style="color: var(--primary-blue); font-weight: bold;">Volver al Inicio</a>
                </div>
            `;
        }

        window.onload = fetchAthlete;
    </script>
    <script src="script.js"></script>
</body>
</html>
